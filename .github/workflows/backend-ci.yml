name: AWARESPAN Backend CI
on:
  push:
    branches: [main]
    paths: ['backend/**', 'build.gradle', 'settings.gradle', 'gradle/**', '.github/workflows/backend-ci.yml']
  pull_request:
    branches: [main]
    paths: ['backend/**', 'build.gradle', 'settings.gradle', 'gradle/**', '.github/workflows/backend-ci.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Run backend tests
        run: ./gradlew test --no-daemon
